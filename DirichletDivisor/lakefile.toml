name = "DirichletDivisor"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DirichletDivisor"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
weak.linter.style.header = false
weak.linter.style.show = false
weak.linter.unusedTactic = false
weak.linter.unreachableTactic = false
weak.linter.unnecessarySeqFocus = false
linter.deprecated = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "DirichletDivisor"
